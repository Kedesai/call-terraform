name: newapp-eks-provisioning

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
        default: 'Dev'
      destroy:
        description: 'Destroy resources'
        required: false
        default: 'false'

  push:
    branches: [ "main" ]
    paths:
      - 'Deployments/**'

  pull_request:
    paths:
      - 'Deployments/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set working directory
        id: detect
        run: echo "dir=Deployments/${{ github.event.inputs.env || 'Dev' }}" >> $GITHUB_OUTPUT

      - name: Terraform Format
        run: terraform fmt -check
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Terraform Plan
        run: terraform plan -input=false
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event.inputs.destroy != 'true'
        run: |
          terraform apply \
              -auto-approve \
              -input=false \
              -var="created_by=${GITHUB_ACTOR}" \
              -var="pipeline_name=${GITHUB_WORKFLOW}" \
              -var="run_id=${GITHUB_RUN_ID}"
        working-directory: ${{ steps.detect.outputs.dir }}

 #     - name: Terraform Destroy
 #       if: github.event.inputs.destroy == 'true'
 #       run: terraform destroy -auto-approve -input=false
 #       working-directory: ${{ steps.detect.outputs.dir }}