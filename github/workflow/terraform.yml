# THIS FILE MUST BE MOVED TO .github/workflows/terraform.yml
name: 'Terraform Plan Summary'

on:
  pull_request:
    paths:
      - 'Deployments/**'

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Install tf-summarize
        run: |
          curl -L https://github.com/dineshba/tf-summarize/releases/download/v0.3.0/tf-summarize_linux_amd64.tar.gz | tar xz
          sudo mv tf-summarize /usr/local/bin/

      - name: Setup Infracost
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Detect Deployment Directory
        id: detect
        run: |
          # Find the directory containing the main.tf file in Deployments/
          DIR=$(find Deployments -name "main.tf" -exec dirname {} \; | head -n 1)
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Terraform Init
        run: terraform init -backend-config="region=us-east-1"
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: TFLint
        run: |
          tflint --init
          tflint -f compact
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -out=tfplan
          terraform show -json tfplan > tfplan.json
          
          # Capture plain english summary
          SUMMARY=$(tf-summarize -tree tfplan.json)
          echo "PLAN_SUMMARY<<EOF" >> "$GITHUB_ENV"
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Generate Infracost Estimate
        run: |
          infracost breakdown --path . \
                            --format json \
                            --out-file /tmp/infracost.json
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Comment on PR
        uses: infracost/actions/comment@v2
        with:
          path: /tmp/infracost.json
          behavior: update
          body: |
            ### Terraform Plan Summary 📝
            ```
            ${{ env.PLAN_SUMMARY }}
            ```