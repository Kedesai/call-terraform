name: 'Terraform'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Deployments/**'
      - 'Deployment/**'
  pull_request:
    paths:
      - 'Deployments/**'
      - 'Deployment/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install tf-summarize
        run: |
          curl -L https://github.com/dineshba/tf-summarize/releases/download/v0.3.0/tf-summarize_linux_amd64.tar.gz | tar xz
          sudo mv tf-summarize /usr/local/bin/

      - name: Detect Deployment Directory
        id: detect
        run: |
          # Robust detection for both singular and plural folder naming
          DIR=$(find . -maxdepth 4 -name "main.tf" -not -path "*/.*" | grep -iE "Deployment" | head -n 1 | xargs dirname)
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Terraform Format
        run: terraform fmt -check
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: TFLint
        run: |
          tflint --init
          tflint -f compact
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > tfplan.json
          SUMMARY=$(tf-summarize -tree tfplan.json)
          echo "PLAN_SUMMARY<<EOF" >> "$GITHUB_ENV"
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        working-directory: ${{ steps.detect.outputs.dir }}

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "### Terraform Plan Summary 📝\n```\n" + process.env.PLAN_SUMMARY + "\n```"
            })

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -auto-approve -input=false
        working-directory: ${{ steps.detect.outputs.dir }}